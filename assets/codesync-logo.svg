<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="syncStreamA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="syncStreamB" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon 容器 -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="url(#shineGrad)" stroke-width="2"/>

  <!-- 科技光环微装饰 -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35"/>

  <!-- 同步主环轨迹：流畅双弧箭头 -->
  <path d="M 72 128 C 72 90 98 62 136 62 C 160 62 180 74 192 94" fill="none" stroke="url(#syncStreamA)" stroke-width="16" stroke-linecap="round"/>
  <polygon points="192,72 206,102 174,102" fill="#ffffff"/>

  <path d="M 184 128 C 184 166 158 194 120 194 C 96 194 76 182 64 162" fill="none" stroke="url(#syncStreamB)" stroke-width="16" stroke-linecap="round"/>
  <polygon points="64,184 50,154 82,154" fill="#38bdf8"/>

  <!-- 核心代码分支节点：中央左侧代码括号 < 与 右侧代码括号 > -->
  <path d="M 112 110 L 96 128 L 112 146" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 144 110 L 160 128 L 144 146" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中心版本同步脉冲光点 -->
  <circle cx="128" cy="128" r="6" fill="#ffffff"/>
  <circle cx="128" cy="128" r="11" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
</svg>
